name: Update YouTube carousels

on:
  schedule:
    # Every Monday 07:00 UTC (~09:00 Europe/Madrid in winter)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest channel videos
        run: npm run update:youtube

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/youtube-projects.json; then
            echo "No carousel changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/youtube-projects.json
          git commit -m "chore: refresh YouTube carousel videos"
          git push
